<style>
/* ---------- tokens: light is the base, dark overrides tokens only ---------- */
:root {

  --ground: #ffffff;
  --surface: #f6f7fb;

  --border: #e1e3ee;
  --border-strong: #c7cadb;
  --code-bg: #f3f4f9;
  --good: #2e7d32; --good-soft: #e5f3e6;
  --warn: #b26a00; --warn-soft: #fff3df;
  --bad:  #c62828; --bad-soft:  #fde8e8;
  --info: var(--accent); --info-soft: var(--accent-soft);
  --shadow: 0 1px 2px rgba(20, 24, 50, .08), 0 4px 14px rgba(20, 24, 50, .06);
  --hl-kw: #7c3aed; --hl-str: #0b7a4b; --hl-num: #b45309; --hl-cmt: #7a7f95; --hl-fn: #1d4ed8; --hl-attr: #9d174d;
  --font-body: "Roboto", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --measure: 46rem;
  --nav-w: 15rem;
  --header-h: 3rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent-ink: #0f1120;
    --ground: #1a1c26;
    --surface: #21242f;
    --surface-2: #2a2e3b;
    --text: #e7e9f2;
    --muted: #a3a8bd;
    --faint: #6d7288;
    --border: #30343f;
    --border-strong: #464b5b;
    --code-bg: #14161e;
    --good: #7bd389; --good-soft: #1e3323;
    --warn: #f0b458; --warn-soft: #3a2c12;
    --bad:  #ff8a80; --bad-soft:  #40201f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --hl-kw: #c4a7ff; --hl-str: #8be0b0; --hl-num: #f4b96b; --hl-cmt: #7d8299; --hl-fn: #8ab4ff; --hl-attr: #f49ac2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent-ink: #0f1120;
  --ground: #1a1c26;
  --surface: #21242f;
  --surface-2: #2a2e3b;
  --text: #e7e9f2;
  --muted: #a3a8bd;
  --faint: #6d7288;
  --border: #30343f;
  --border-strong: #464b5b;
  --code-bg: #14161e;
  --good: #7bd389; --good-soft: #1e3323;
  --warn: #f0b458; --warn-soft: #3a2c12;
  --bad:  #ff8a80; --bad-soft:  #40201f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --hl-kw: #c4a7ff; --hl-str: #8be0b0; --hl-num: #f4b96b; --hl-cmt: #7d8299; --hl-fn: #8ab4ff; --hl-attr: #f49ac2;
  color-scheme: dark;
}
/* dark accent gets lifted so it reads on the dark ground */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: color-mix(in srgb, __TECHDOC_ACCENT__ 55%, #ffffff); } }
:root[data-theme="dark"] { --accent: color-mix(in srgb, __TECHDOC_ACCENT__ 55%, #ffffff); }

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 1rem); }
body { margin: 0; background: var(--ground); color: var(--text); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-weight: 500; line-height: 1.25; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 2.1rem; font-weight: 400; margin: 0 0 .75rem; }
h2 { font-size: 1.55rem; margin: 2.6rem 0 .9rem; padding-bottom: .35rem; border-bottom: 1px solid var(--border); }

strong { font-weight: 500; }
code, kbd, pre, samp { font-family: var(--font-mono); font-size: .86em; }
code { background: var(--code-bg); border-radius: 3px; padding: .1em .35em; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: .9rem 1rem; overflow-x: auto; margin: 0 0 1rem; line-height: 1.5; }

img { max-width: 100%; height: auto; display: block; }
figure { margin: 1.4rem 0; }
figcaption { color: var(--muted); font-size: .85rem; margin-top: .55rem; line-height: 1.45; }
figcaption::before { content: "Figure " counter(figure) ". "; font-weight: 500; color: var(--text); }
figure { counter-increment: figure; }
.article { counter-reset: figure; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }

/* ---------- chrome ---------- */
.header { position: sticky; top: 0; z-index: 30; height: var(--header-h); display: flex; align-items: center; gap: 1rem; padding: 0 1rem; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
.header .brand { font-weight: 500; font-size: .95rem; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; text-decoration: none; }
.header .spacer { flex: 1; }
.header .meta { font-size: .78rem; opacity: .85; white-space: nowrap; }
.header button { font: inherit; font-size: .78rem; color: inherit; background: color-mix(in srgb, var(--accent-ink) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent-ink) 30%, transparent); border-radius: 3px; padding: .25rem .6rem; cursor: pointer; }
.header button[aria-pressed="true"] { background: var(--accent-ink); color: var(--accent); }
.header .nav-toggle { display: none; }
.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); gap: 3rem; max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }
.sidebar { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 1.5rem 0; font-size: .82rem; }

.sidebar ul { list-style: none; padding: 0; margin: 0; }
.sidebar li { margin: 0; }
.sidebar a { display: block; color: var(--muted); text-decoration: none; padding: .28rem .6rem; border-left: 2px solid transparent; line-height: 1.35; }
.sidebar a:hover { color: var(--text); }
.sidebar a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
.sidebar ul ul a { padding-left: 1.5rem; font-size: .78rem; }
.sidebar ul ul { display: none; }
.sidebar li.open > ul { display: block; }
.nav a { border-left: 0; border-radius: 3px; }
.nav a.active { background: var(--accent-soft); }
.article { padding: 2.5rem 0 6rem; max-width: var(--measure); min-width: 0; }
.article .title-block { margin-bottom: 2.5rem; }
.article .lede { font-size: 1.12rem; color: var(--muted); max-width: 40rem; }
.article .byline { font-size: .8rem; color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; margin-top: .75rem; }
.heading-anchor { color: var(--faint); text-decoration: none; margin-left: .4rem; opacity: 0; font-weight: 400; }
h2:hover .heading-anchor, h3:hover .heading-anchor { opacity: 1; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 0 1rem; }
  .nav { display: none; position: fixed; left: 0; top: var(--header-h); width: min(80vw, 20rem); background: var(--ground); border-right: 1px solid var(--border); padding: 1rem; z-index: 20; }
  .nav.open { display: block; }
  .header .nav-toggle { display: inline-block; }
  .header .meta { display: none; }
}

/* ---------- admonitions, tabs, details ---------- */
.admonition { border-left: 4px solid var(--info); background: var(--surface); border-radius: 0 4px 4px 0; padding: .7rem 1rem .1rem; margin: 0 0 1.2rem; font-size: .93rem; }
.admonition-title { font-weight: 500; margin: 0 0 .4rem; display: flex; align-items: center; gap: .5rem; }
.admonition-title::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--info); flex: none; }
.admonition.tip, .admonition.success { border-left-color: var(--good); } .admonition.tip .admonition-title::before, .admonition.success .admonition-title::before { background: var(--good); }
.admonition.warning, .admonition.caution { border-left-color: var(--warn); } .admonition.warning .admonition-title::before, .admonition.caution .admonition-title::before { background: var(--warn); }
.admonition.danger, .admonition.failure, .admonition.bug { border-left-color: var(--bad); } .admonition.danger .admonition-title::before, .admonition.failure .admonition-title::before, .admonition.bug .admonition-title::before { background: var(--bad); }
.admonition.question, .admonition.example, .admonition.abstract { border-left-color: var(--muted); } .admonition.question .admonition-title::before, .admonition.example .admonition-title::before, .admonition.abstract .admonition-title::before { background: var(--muted); }
details.admonition > summary { list-style: none; cursor: pointer; }
details.admonition > summary::-webkit-details-marker { display: none; }
details.admonition > summary::after { content: "▸"; float: right; color: var(--muted); transition: transform .15s; }
details.admonition[open] > summary::after { transform: rotate(90deg); }
.tabs { margin: 0 0 1.2rem; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.tabs .tab-list { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
.tabs .tab-list button { font: inherit; font-size: .82rem; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: .55rem .9rem; cursor: pointer; white-space: nowrap; }
.tabs .tab-list button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .tab-panel { padding: 1rem 1rem 0; }
.tabs .tab-panel[hidden] { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; margin: 0 0 1.2rem; }
.grid > .card { border: 1px solid var(--border); border-radius: 4px; padding: .9rem 1rem; background: var(--surface); }
.grid > .card > :last-child { margin-bottom: 0; }
.grid > .card h4 { margin-top: 0; }

/* ---------- code + output (showboat) ---------- */
.codeblock { margin: 0 0 1.2rem; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.codeblock .code-head { display: flex; align-items: center; gap: .6rem; padding: .35rem .8rem; background: var(--surface); border-bottom: 1px solid var(--border); font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.codeblock .code-head .lang { color: var(--accent); }
.codeblock .code-head .file { text-transform: none; letter-spacing: 0; font-family: var(--font-mono); color: var(--text); }
.codeblock .code-head .copy { margin-left: auto; font: inherit; color: var(--muted); background: none; border: 1px solid var(--border-strong); border-radius: 3px; padding: .1rem .5rem; cursor: pointer; text-transform: none; letter-spacing: 0; }
.codeblock pre { border: 0; border-radius: 0; margin: 0; }
.codeblock .output { border-top: 1px dashed var(--border-strong); }
.codeblock .output pre { background: var(--ground); }
.codeblock .output .code-head { background: var(--good-soft); color: var(--good); border-bottom-color: var(--border); }
.codeblock .output .code-head::before { content: "▶"; font-size: .6rem; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-built_in { color: var(--hl-kw); }
.hljs-string, .hljs-regexp { color: var(--hl-str); }
.hljs-number, .hljs-symbol { color: var(--hl-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--hl-cmt); font-style: italic; }
.hljs-title, .hljs-function .hljs-title, .hljs-section { color: var(--hl-fn); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-name { color: var(--hl-attr); }

/* ---------- figures, screenshots, mermaid ---------- */
figure.screenshot img { border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); }
figure.screenshot .browser { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
figure.screenshot .browser .bar { display: flex; align-items: center; gap: .5rem; padding: .4rem .7rem; border-bottom: 1px solid var(--border); font-size: .72rem; color: var(--muted); font-family: var(--font-mono); }
figure.screenshot .browser .bar i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--border-strong); display: inline-block; }
figure.screenshot .browser .bar .url { flex: 1; background: var(--ground); border-radius: 3px; padding: .1rem .5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
figure.screenshot .browser img { border: 0; border-radius: 0; box-shadow: none; }
pre.mermaid { background: none; border: 0; padding: 0; overflow-x: auto; text-align: center; }
pre.mermaid svg { max-width: 100%; height: auto; }
figure.diagram { text-align: left; }
.fig-wrap { overflow-x: auto; }

/* ---------- flow diagram + inspector ---------- */
.flow { margin: 0 0 1.4rem; }
.flow svg { display: block; max-width: 100%; height: auto; color: var(--text); font-family: var(--font-body); }
.flow .node { cursor: pointer; }
.flow .node .shape { fill: var(--ground); stroke: currentColor; stroke-width: 1.2; }
.flow .node.kind-table .shape, .flow .node.kind-store .shape { fill: var(--surface); }
.flow .node .band { fill: currentColor; opacity: .12; }
.flow .node text { font-size: 12px; fill: currentColor; pointer-events: none; }
.flow .node .kind { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
.flow .node:hover .shape { stroke-width: 1.8; }
.flow .node.selected .shape { stroke: var(--accent); stroke-width: 2.2; }
.flow .node.selected .band { fill: var(--accent); opacity: .18; }
.flow .node.has-data .shape { stroke-dasharray: none; }
.flow .edge path { fill: none; stroke: currentColor; stroke-width: 1.2; }
.flow .edge text { font-size: 10.5px; fill: var(--muted); }
.flow .edge.dim path { opacity: .25; }
.flow .edge.dim text { opacity: .25; }
.flow .edge.hot path { stroke: var(--accent); stroke-width: 1.8; }
.flow .edge.hot text { fill: var(--accent); }
.flow .added .shape { stroke: var(--good); } .flow .added.node text { fill: var(--good); }
.flow .removed .shape { stroke: var(--bad); stroke-dasharray: 4 3; } .flow .removed.node text { fill: var(--bad); }
.flow .edge.added path { stroke: var(--good); } .flow .edge.added text { fill: var(--good); }
.flow .edge.removed path { stroke: var(--bad); stroke-dasharray: 4 3; } .flow .edge.removed text { fill: var(--bad); }
.flow .edge.added marker path, .flow .edge.removed marker path { stroke-dasharray: none; }
.flow .edge.changed path { stroke: var(--warn); } .flow .edge.changed text { fill: var(--warn); }
.flow .hint { font-size: .78rem; color: var(--muted); margin: .3rem 0 0; }
.inspector { border: 1px solid var(--border); border-radius: 4px; background: var(--surface); margin-top: .8rem; overflow: hidden; }
.inspector[hidden] { display: none; }
.inspector .insp-head { display: flex; align-items: baseline; gap: .8rem; padding: .6rem 1rem; border-bottom: 1px solid var(--border); background: var(--accent-soft); }
.inspector .insp-head .name { font-weight: 500; }
.inspector .insp-head .kind { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.inspector .insp-head .close { margin-left: auto; font: inherit; font-size: .75rem; color: var(--muted); background: none; border: 0; cursor: pointer; }
.inspector .insp-body { padding: .9rem 1rem; font-size: .9rem; }
.inspector .insp-body > p { margin: 0 0 .8rem; }
.inspector .panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.inspector .pane .pane-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0 0 .4rem; display: flex; gap: .5rem; align-items: baseline; }
.inspector .pane .pane-label .shape-note { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; color: var(--faint); }
.inspector .pane .table-wrap { margin: 0; border: 1px solid var(--border); border-radius: 3px; background: var(--ground); }
.inspector table { font-size: .8rem; font-family: var(--font-mono); }
.inspector th, .inspector td { padding: .3rem .55rem; white-space: nowrap; }
.inspector .more { font-size: .75rem; color: var(--muted); padding: .3rem .55rem; }
.inspector pre { margin: .6rem 0 0; }
.cell-added, th.col-added { background: var(--good-soft); color: var(--good); }
.cell-removed, th.col-removed { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.cell-changed { background: var(--warn-soft); }
.cell-changed .old { color: var(--muted); text-decoration: line-through; margin-right: .4em; }
.cell-changed .new { color: var(--warn); font-weight: 500; }
tr.row-added td { background: var(--good-soft); }
tr.row-removed td { background: var(--bad-soft); color: var(--muted); text-decoration: line-through; }
td.status { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
tr.row-added td.status { color: var(--good); text-decoration: none; }
tr.row-removed td.status { color: var(--bad); text-decoration: none; }
tr.row-changed td.status { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .75rem; color: var(--muted); margin: .4rem 0 0; }
.legend span::before { content: ""; display: inline-block; width: 1.2em; height: .6em; margin-right: .35em; border: 1.5px solid currentColor; vertical-align: middle; border-radius: 2px; }
.legend .l-added { color: var(--good); } .legend .l-removed { color: var(--bad); } .legend .l-changed { color: var(--warn); }
.legend .l-removed::before { border-style: dashed; }
.diffpair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
.diffpair .side .side-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0 0 .3rem; }
.diffpair .side .flow { margin: 0; border: 1px solid var(--border); border-radius: 4px; padding: .5rem; background: var(--surface); }
.diffpair .side .flow svg { margin: 0 auto; }
@media (max-width: 700px) { .diffpair { grid-template-columns: 1fr; } }
.diff-summary { font-size: .82rem; color: var(--muted); margin: .5rem 0 0; }
.diff-summary b { color: var(--text); font-weight: 500; }

/* ---------- expandable figures ---------- */
figure.diagram, figure.screenshot { position: relative; }
.expand { position: absolute; top: .3rem; right: .3rem; z-index: 2; font: inherit; font-size: .72rem; color: var(--muted); background: var(--ground); border: 1px solid var(--border-strong); border-radius: 3px; padding: .15rem .5rem; cursor: pointer; opacity: 0; transition: opacity .15s; }
figure:hover > .expand, figure:focus-within > .expand { opacity: 1; }
.lightbox { border: 0; padding: 0; background: var(--ground); color: var(--text); width: min(96vw, 1600px); height: 94vh; max-width: none; max-height: none; border-radius: 6px; box-shadow: var(--shadow); }
.lightbox::backdrop { background: rgba(10, 12, 24, .6); backdrop-filter: blur(2px); }
.lightbox .lb-head { display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; border-bottom: 1px solid var(--border); font-size: .85rem; }
.lightbox .lb-head .lb-title { font-weight: 500; flex: 1; }
.lightbox .lb-head button { font: inherit; font-size: .78rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 3px; padding: .2rem .6rem; cursor: pointer; }
.lightbox .lb-body { height: calc(94vh - 2.6rem); overflow: auto; padding: 1.5rem; }
.lightbox .lb-body .fig-wrap { overflow: visible; }
.lightbox .lb-body svg { max-width: none; width: calc(100% * var(--zoom, 1)); height: auto; }
.lightbox .lb-body pre.mermaid svg { width: calc(100% * var(--zoom, 1)); max-width: none; }
.lightbox .lb-body .browser img, .lightbox .lb-body > img { width: calc(100% * var(--zoom, 1)); max-width: none; }
.lightbox .lb-body .flow, .lightbox .lb-body .diffpair { margin: 0; }
.lightbox .lb-body .diffpair { grid-template-columns: 1fr 1fr; }
.lightbox .lb-body .inspector table { font-size: .85rem; }

/* ---------- slides mode ---------- */
body.slides .layout { display: block; max-width: none; padding: 0; }

<script>

  /* ---------- flow layout (layered DAG, longest-path layering) ---------- */

  function dataTable(t, other, side) {

    };
    host.addEventListener('click', e => { const g = e.target.closest('.node'); if (g) { select(g.classList.contains('selected') ? null : g.dataset.id); return; } if (e.target.closest('.close')) select(null); });
    host.addEventListener('keydown', e => { const g = e.target.closest('.node'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(g.dataset.id); } });
    if (data.select) select(data.select);
  }
  function mountGraphDiff(host, data) {
    const before = data.before || { nodes: [], edges: [] }, after = data.after || { nodes: [], edges: [] };
    const key = e => `${e.from}→${e.to}`;
    const bN = new Set(before.nodes.map(n => n.id)), aN = new Set(after.nodes.map(n => n.id));
    const bE = new Map(before.edges.map(e => [key(e), e])), aE = new Map(after.edges.map(e => [key(e), e]));
    const statusB = { node: n => aN.has(n.id) ? '' : 'removed', edge: e => aE.has(key(e)) ? (aE.get(key(e)).label !== e.label ? 'changed' : '') : 'removed' };
    const statusA = { node: n => bN.has(n.id) ? '' : 'added', edge: e => bE.has(key(e)) ? (bE.get(key(e)).label !== e.label ? 'changed' : '') : 'added' };
    const fig = document.createElement('figure'); fig.className = 'diagram'; host.replaceWith(fig);
    fig.innerHTML = `<div class="diffpair"><div class="side"><p class="side-label">${esc(data.before_label || 'Before')}</p><div class="flow" id="${host.id}-b"></div></div><div class="side"><p class="side-label">${esc(data.after_label || 'After')}</p><div class="flow" id="${host.id}-a"></div></div></div>`;
    renderFlow(fig.querySelector(`#${host.id}-b`), { ...before, direction: data.direction }, statusB);
    renderFlow(fig.querySelector(`#${host.id}-a`), { ...after, direction: data.direction }, statusA);
    const addedN = [...aN].filter(x => !bN.has(x)).length, removedN = [...bN].filter(x => !aN.has(x)).length;
    const addedE = [...aE.keys()].filter(x => !bE.has(x)).length, removedE = [...bE.keys()].filter(x => !aE.has(x)).length;
    const changedE = [...aE.entries()].filter(([k, e]) => bE.has(k) && bE.get(k).label !== e.label).length;
    fig.insertAdjacentHTML('beforeend', `<div class="legend"><span class="l-added">added</span><span class="l-removed">removed</span>${changedE ? '<span class="l-changed">relabelled</span>' : ''}</div><p class="diff-summary">Nodes <b>+${addedN}</b> / <b>−${removedN}</b> · Edges <b>+${addedE}</b> / <b>−${removedE}</b>${changedE ? ` · <b>${changedE}</b> relabelled` : ''}</p>`);
    if (data.caption) fig.insertAdjacentHTML('beforeend', `<figcaption>${esc(data.caption)}</figcaption>`);
  }
  function mountTableDiff(host, data) {
    const before = data.before || { columns: [], rows: [] }, after = data.after || { columns: [], rows: [] };
    const keyCols = [].concat(data.key || before.columns[0]);
    const cols = [...new Set([...before.columns, ...after.columns])];
    const idx = (t, c) => t.columns.indexOf(c);
    const keyOf = (t, r) => keyCols.map(c => String(r[idx(t, c)] ?? '')).join('|');
    const bRows = new Map(before.rows.map(r => [keyOf(before, r), r])), aRows = new Map(after.rows.map(r => [keyOf(after, r), r]));
    const order = [...new Set([...bRows.keys(), ...aRows.keys()])];
    let added = 0, removed = 0, changed = 0;
    const trs = order.map(k => {
      const b = bRows.get(k), a = aRows.get(k);
      let cls = '', label = '';
      if (!b) { cls = 'row-added'; label = 'added'; added++; } else if (!a) { cls = 'row-removed'; label = 'removed'; removed++; }
      const tds = cols.map(c => {
        const bi = idx(before, c), ai = idx(after, c);
        const bv = b && bi >= 0 ? String(b[bi] ?? '') : null, av = a && ai >= 0 ? String(a[ai] ?? '') : null;
        if (b && a && bv !== av) { if (!cls) { cls = 'row-changed'; label = 'changed'; changed++; } return `<td><span class="cell-changed"><span class="old">${esc(bv ?? '')}</span><span class="new">${esc(av ?? '')}</span></span></td>`; }
        return `<td>${esc(av ?? bv ?? '')}</td>`;
      }).join('');
      return `<tr class="${cls}">${tds}<td class="status">${label}</td></tr>`;
    }).join('');
    const th = cols.map(c => { const inB = before.columns.includes(c), inA = after.columns.includes(c); return `<th class="${!inB ? 'col-added' : !inA ? 'col-removed' : ''}">${esc(c)}</th>`; }).join('') + '<th></th>';
    const fig = document.createElement('figure'); fig.className = 'diagram inspector-static'; host.replaceWith(fig);
    fig.innerHTML = `<div class="inspector" style="margin:0"><div class="insp-head"><span class="name">${esc(data.title || 'Rows before and after')}</span><span class="kind">key: ${esc(keyCols.join(', '))}</span></div><div class="insp-body" style="padding:0"><div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table></div></div></div><p class="diff-summary">Rows <b>+${added}</b> added · <b>−${removed}</b> removed · <b>${changed}</b> changed · ${order.length - added - removed - changed} unchanged</p>${data.caption ? `<figcaption>${esc(data.caption)}</figcaption>` : ''}`;
  }
  for (const b of blocks) {
    const host = document.getElementById(b.id); if (!host) continue;
    try { if (b.kind === 'flow') mountFlow(host, b.data); else if (b.kind === 'graph-diff') mountGraphDiff(host, b.data); else if (b.kind === 'table-diff') mountTableDiff(host, b.data); }
    catch (e) { host.outerHTML = `<div class="admonition danger"><p class="admonition-title">Could not render ${esc(b.kind)}</p><p>${esc(e.message)}</p></div>`; }
  }

  /* ---------- expandable figures: move the figure's content into a modal and back ---------- */
  const lb = document.getElementById('lightbox'), lbBody = document.getElementById('lbBody'), lbTitle = document.getElementById('lbTitle');
  let lbOrigin = null, zoom = 1;
  const setZoom = z => { zoom = Math.max(.5, Math.min(4, z)); lbBody.style.setProperty('--zoom', zoom); };
  article.querySelectorAll('figure.diagram, figure.screenshot').forEach(fig => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'expand'; btn.textContent = 'Expand ⤢'; btn.setAttribute('aria-label', 'Expand figure');
    fig.prepend(btn);
    btn.addEventListener('click', () => {
      const cap = fig.querySelector(':scope > figcaption');
      lbTitle.textContent = cap ? cap.textContent : (fig.querySelector('svg[aria-label]')?.getAttribute('aria-label') || 'Figure');
      lbOrigin = { fig, marker: document.createComment('lb'), nodes: Array.from(fig.childNodes).filter(n => n !== btn && n !== cap) };
      fig.insertBefore(lbOrigin.marker, lbOrigin.nodes[0] || null);
      lbOrigin.nodes.forEach(n => lbBody.appendChild(n));
      setZoom(1); lb.showModal();
    });
  });
  const lbRestore = () => { if (!lbOrigin) return; lbOrigin.nodes.forEach(n => lbOrigin.fig.insertBefore(n, lbOrigin.marker)); lbOrigin.marker.remove(); lbOrigin = null; lbBody.innerHTML = ''; };
  lb.addEventListener('close', lbRestore);
  document.getElementById('lbClose').addEventListener('click', () => lb.close());
  document.getElementById('lbIn').addEventListener('click', () => setZoom(zoom * 1.25));
  document.getElementById('lbOut').addEventListener('click', () => setZoom(zoom / 1.25));
  document.getElementById('lbFit').addEventListener('click', () => setZoom(1));
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
  lb.addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25); else if (e.key === '-') setZoom(zoom / 1.25); else if (e.key === '0') setZoom(1); });

  /* ---------- slides mode ---------- */
  let idx = 0;
  const modeDoc = document.getElementById('modeDoc'), modeSlides = document.getElementById('modeSlides');
  function setMode(slides) {
    document.body.classList.toggle('slides', slides);
    modeDoc.setAttribute('aria-pressed', !slides); modeSlides.setAttribute('aria-pressed', slides);
    try { localStorage.setItem('techdoc-mode', slides ? 'slides' : 'doc'); } catch (e) {}
    if (slides) show(idx); else { document.getElementById('progress').style.width = '0'; spy(); }
  }
  function show(i) {
    idx = Math.max(0, Math.min(sections.length - 1, i));
    sections.forEach((s, k) => s.classList.toggle('current', k === idx));
    document.getElementById('slideCounter').textContent = `${idx + 1} / ${sections.length}`;
    document.getElementById('progress').style.width = `${((idx + 1) / sections.length) * 100}%`;
    window.scrollTo({ top: 0 });
    history.replaceState(null, '', '#' + sections[idx].dataset.id);
  }
  modeDoc.addEventListener('click', () => setMode(false));
  modeSlides.addEventListener('click', () => setMode(true));
  document.getElementById('prevSlide').addEventListener('click', () => show(idx - 1));
  document.getElementById('nextSlide').addEventListener('click', () => show(idx + 1));
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea') || lb.open) return;
    if (!document.body.classList.contains('slides')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(idx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(sections.length - 1);
    else if (e.key === 'n') document.body.classList.toggle('notes');
  });
  let startSlides = FRONT.mode === 'slides';
  try { const saved = localStorage.getItem('techdoc-mode'); if (saved) startSlides = saved === 'slides'; } catch (e) {}
  if (location.hash) { const k = sections.findIndex(s => s.dataset.id === location.hash.slice(1)); if (k >= 0) idx = k; }
  setMode(startSlides);

  /* ---------- mermaid (native in Artifacts; standalone loads the library) ---------- */
  if (window.mermaid) {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', fontFamily: 'Roboto, sans-serif' });
    mermaid.run({ querySelector: 'pre.mermaid' });
  }
})();
</script>
